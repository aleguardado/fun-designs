<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos | Fun Designs</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<header class="header">
 <div> <span class="logo-text">Fun Designs</span> </div> 
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item"> <a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"> <a class="nav-link" href="productos.html">Productos</a></li>
        <li class="nav-item"> <a class="nav-link" href="#">Personalización</a></li>
        <li class="nav-item"> <a class="nav-link text-nowrap" href="#">Sobre nosotros</a></li>
      </ul>
    </div>
  </nav>
  <div class="header-icons">
    <div class="icon-placeholder"> <img src="img/search.png" alt="busqueda" width="45"> </div>
    <div class="icon-placeholder"> <img src="img/carrito.png" alt="carrito" width="45"> </div>
    <div class="icon-placeholder"> <img src="img/usuario.png" alt="usuario" width="45"> </div>
  </div>
</header>

<main>
  <section id="productos" class="container-fluid">
    <div class="container py-5">

      <div class="search-box mx-auto mb-5">
        <img src="img/search.png" alt="" class="search-box-icon">
        <input type="text" placeholder="Busca en Fun Designs" aria-label="Busca en Fun Designs">
      </div>

      <div class="browse-list">

        <article class="browse-card">
          <div class="browse-thumb">
            <img src="img/Camisa_Bordada.png" alt="Ropa bordada" class="img-fluid">
          </div>
          <div class="browse-info">
            <h2>Ropa bordada</h2>
            <p>Diseños bordados personalizados y de calidad.</p>
          </div>
        </article>

        <article class="browse-card">
          <div class="browse-thumb">
            <img src="img/Hoodie Angel.png" alt="Ropa casual" class="img-fluid">
          </div>
          <div class="browse-info">
            <h2>Ropa casual</h2>
            <p>Suéteres y prendas para un estilo cómodo y casual.</p>
          </div>
        </article>

        <article class="browse-card">
          <div class="browse-thumb">
            <img src="img/Jeans.png" alt="Pantalones" class="img-fluid">
          </div>
          <div class="browse-info">
            <h2>Pantalones</h2>
            <p>Pantalones con diseños personalizados y originales.</p>
          </div>
        </article>

      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
