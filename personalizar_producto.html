<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalización | Fun Designs</title>
    <meta name="description"
        content="Personaliza tus productos en Fun Designs. Elige colores, tallas y técnicas para crear un diseño único.">
    <meta name="keywords"
        content="Fun Designs, personalización, camisetas, bordado, impresión, serigrafía">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8MX5EQNZ4L"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
        dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-8MX5EQNZ4L');
</script>
<body>
<main class="customizer">


    <!-- ========================================
         BARRA SUPERIOR
    ======================================== -->
    <header class="customizer-header">
        <div class="product-name">
            <h1>
                Nombre del Producto
            </h1>
            <input
                type="text"
                value="Nombre del Producto"
                aria-label="Nombre del producto">
        </div>
        <div class="editor-actions">
            <button
                type="button"
                aria-label="Deshacer">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button
                type="button"
                aria-label="Rehacer">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <a href="index.html" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i>
            </a>
        </div>
    </header>
	
    <div class="customizer-body">

        <!-- ========================================
             BARRA DE HERRAMIENTAS
        ======================================== -->
        <aside class="tool-sidebar">
            <button class="tool-button active">
                <i class="fa-solid fa-shirt"></i>
                <span>
                    Producto
                </span>
            </button>
            <button class="tool-button">
                <i class="fa-solid fa-layer-group"></i>
                <span>
                    Capas
                </span>
            </button>
            <button class="tool-button">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
                <span>
                    Subidas
                </span>
            </button>
            <button class="tool-button">
                <i class="fa-solid fa-font"></i>
                <span>
                    Texto
                </span>
            </button>
        </aside>



        <!-- ========================================
             PANEL DE OPCIONES
        ======================================== -->

        <aside class="options-panel">
            <h2>
                Nombre del Producto
            </h2>

            <div class="rating">
                <span>
                    ★
                </span>
                45
            </div>
            <hr>

            <!-- TÉCNICA -->
            <div class="option-group">
                <label>
                    Técnica
                </label>
                <div class="technique-buttons">
                    <button type="button">
                        Impresión
                    </button>
                    <button type="button">
                        Bordado
                    </button>
                    <button type="button">
                        Serigrafía
                    </button>
                    <button type="button">
                        Sublimación
                    </button>
                </div>
            </div>

            <!-- COLOR -->
            <div class="option-group">
                <label>
                    Color
                </label>
                <div class="color-options">
                    <button
                        class="color red"
                        aria-label="Rojo">
                    </button>
                    <button
                        class="color green"
                        aria-label="Verde">
                    </button>
                    <button
                        class="color yellow"
                        aria-label="Amarillo">
                    </button>
                    <button
                        class="color orange"
                        aria-label="Naranja">
                    </button>
                </div>
            </div>

            <!-- TALLA -->
            <div class="option-group">
                <label>
                    Talla
                </label>
                <div class="size-options">
                    <button>
                        XS
                    </button>
                    <button class="selected">
                        S
                    </button>

                    <button>
                        M
                    </button>

                    <button>
                        L
                    </button>

                    <button>
                        XL
                    </button>
                </div>
            </div>
            <div class="customizer-decoration">
                <img src="img/chickrock1.png" alt="Decoración">
            </div>
        </aside>


        <!-- ========================================
             ÁREA PRINCIPAL
        ======================================== -->

        <section class="product-preview">


            <!-- CATEGORÍAS DE VISTA -->

            <div class="preview-tabs">

                <button>
                    Pecho izquierdo
                </button>

                <button>
                    Centro pecho
                </button>

                <button>
                    Centro ampliado
                </button>

                <button>
                    Muñeca izquierda
                </button>

                <button>
                    Muñeca derecha
                </button>

                <button
                    class="next-view"
                    aria-label="Siguiente">

                    <i class="fa-solid fa-chevron-right"></i>

                </button>

            </div>



            <!-- PRODUCTO -->

            <div class="product-canvas">
                <img src="img/skater_break.png"alt="Vista previa de Camisa Skater"class="custom-product-image">
            </div>

        </section>

    </div>



    <!-- ========================================
         BARRA INFERIOR
    ======================================== -->

    <footer class="customizer-footer">
        <div class="cart-information">
            <i class="fa-solid fa-cart-shopping"></i>
            <strong>
                $35.19
            </strong>
        </div>
        <a
            href="carrito.html"
            class="add-cart-button">

            Añadir al Carrito
        </a>
    </footer>
</main>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
