<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce y personaliza la Camisa Skater Break de Fun Designs.">
    <title>Camisa Skater Break | Fun Designs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
.detalle-page {
    background: #5e8ea6;
    color: #090909;
}

.detalle-page .fun-navbar {
    background: #cfb643;
    border-bottom: 3px solid #000;
}

.detalle-page .fun-navbar .nav-link {
    font-weight: 400;
}

.detalle-page .fun-navbar .dropdown-toggle.active {
    padding: 2px 10px;
    border: 1px solid #000;
    text-decoration: none;
}

.detalle-main {
    min-height: calc(100vh - 110px);
    padding: 49px clamp(24px, 3.7vw, 64px) 65px clamp(24px, 8.5vw, 148px);
}

.detalle-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.88fr) minmax(0, 1fr);
    align-items: start;
    column-gap: clamp(32px, 4.3vw, 75px);
    max-width: 1530px;
    margin-inline: auto;
}

.detalle-preview {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: 2px solid #000;
    background: #94b2c0;
}

.detalle-preview img {
    display: block;
    width: 88%;
    height: 88%;
    object-fit: contain;
    transition: transform 300ms ease;
    transform-origin: center;
}

.detalle-preview[data-vista="1"] img { transform: scale(1.2) rotate(-11deg); }
.detalle-preview[data-vista="2"] img { transform: scale(2.05) translate(7%, 1%) rotate(7deg); }
.detalle-preview[data-vista="3"] img { transform: scale(1.75) translate(-9%, 22%); }
.detalle-preview[data-vista="4"] img { transform: scale(2.1) translate(4%, -14%) rotate(8deg); }
.detalle-preview[data-vista="5"] img { transform: scale(1.9) translate(3%, -2%) rotate(-12deg); }

.detalle-miniaturas {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(7px, 1.05vw, 18px);
    margin-top: 17px;
}

.detalle-miniatura {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    padding: 0;
    border-radius: 0;
}

.detalle-miniatura img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: fill;
}

.detalle-miniatura:hover {
    filter: brightness(1.08);
}

.detalle-miniatura[aria-pressed="true"] {
    outline: 3px solid #dfbb35;
    outline-offset: 3px;
}

.detalle-info {
    position: relative;
    min-width: 0;
}

.detalle-info h1 {
    font: 400 clamp(36px, 3.45vw, 58px) / 1.16 'DM Serif Display', Georgia, serif;
    margin: 4px 0 8px;
}

.detalle-rating {
    display: flex;
    align-items: center;
    color: #a41619;
    font-family: Arial, sans-serif;
    font-size: clamp(30px, 2.8vw, 42px);
    line-height: 1;
    letter-spacing: 0;
    white-space: nowrap;
}

.detalle-media-estrella {
    display: inline-block;
    position: relative;
}

.detalle-media-estrella > span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 50%;
    overflow: hidden;
}

.detalle-separador {
    opacity: 1;
    border: none;
    border-top: 2px solid #000;
    margin: 22px 0 24px;
}

.detalle-grupo {
    min-width: 0;
    border: 0;
    padding: 0;
}

.detalle-grupo legend {
    float: none;
    display: block;
    width: auto;
    font: 400 clamp(19px, 1.55vw, 24px) / 1.35 'Poppins', sans-serif;
    margin: 0;
}

.detalle-tecnica {
    margin-bottom: 26px;
}

.detalle-tecnicas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(20px, 4.6vw, 72px);
    margin: 23px auto 0;
    max-width: 513px;
}

.detalle-tecnica-btn {
    min-height: 56px;
    border: 2px solid #000;
    background: #94b2c0;
    color: #111;
    font-size: clamp(17px, 1.85vw, 28px);
    font-weight: 400;
    white-space: nowrap;
    padding: 7px;
}

.detalle-tecnica-btn[aria-pressed="true"] {
    background: #a5c0cb;
}

.detalle-colores {
    margin-bottom: 41px;
}

.detalle-swatches {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.detalle-swatch {
    display: block;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 2px solid #000;
    border-radius: 0;
    background: var(--swatch);
}

.detalle-swatch[aria-pressed="true"] {
    outline: 2px solid #000;
    outline-offset: 3px;
}

.detalle-tallas {
    margin-bottom: 40px;
}

.detalle-tallas-opciones {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
}

.detalle-tallas-opciones button {
    width: 42px;
    height: 42px;
    padding: 0;
    border: 2px solid #000;
    border-radius: 0;
    background: #94b2c0;
    color: #101010;
    font-size: 18px;
}

.detalle-tallas-opciones button[aria-pressed="true"] {
    background: #dfbb35;
}

.detalle-precio {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}

.detalle-precio > span {
    font-size: clamp(19px, 1.55vw, 24px);
}

.detalle-precio > strong {
    font: 400 clamp(30px, 2.6vw, 40px) / 1.2 'DM Serif Display', Georgia, serif;
}

.detalle-estrella {
    position: absolute;
    display: block;
    width: 29%;
    height: auto;
    right: 9%;
    top: 49%;
    pointer-events: none;
}

.detalle-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(100%, 444px);
    min-height: 86px;
    margin: 16px auto 0;
    padding: 12px 18px;
    border: 2px solid #000;
    border-radius: 14px;
    background: #94b2c0;
    color: #090909;
    font: 400 clamp(21px, 2.15vw, 33px) / 1.2 'DM Serif Display', Georgia, serif;
    text-align: center;
    text-decoration: none;
}

.detalle-cta:hover {
    background: #dfbb35;
    color: #000;
}

.detalle-page button:focus-visible,
.detalle-page a:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
}

@media (max-width: 1100px) {
    .detalle-main { padding: 35px 35px 65px; }
    .detalle-grid { column-gap: 34px; }
    .detalle-estrella { width: 25%; top: 56%; right: 6%; }
    .detalle-tecnicas { gap: 16px; }
}

@media (max-width: 767.98px) {
    .detalle-main { padding: 28px 20px 52px; }
    .detalle-grid { grid-template-columns: minmax(0, 1fr); gap: 34px; max-width: 600px; }
    .detalle-info h1 { font-size: clamp(32px, 7vw, 46px); }
    .detalle-tecnicas { max-width: none; }
    .detalle-estrella { width: 120px; top: auto; bottom: 110px; right: 2%; }
    .detalle-cta { margin-top: 28px; }
    .detalle-page .fun-navbar .dropdown-toggle.active { display: inline-block; }
}

@media (max-width: 420px) {
    .detalle-main { padding-inline: 14px; }
    .detalle-miniaturas { gap: 5px; }
    .detalle-tallas-opciones { gap: 7px; }
    .detalle-tecnica-btn { font-size: 17px; }
    .detalle-estrella { width: 95px; bottom: 128px; }
    .detalle-cta { min-height: 70px; }
}

    </style>

                        <button class="detalle-tecnica-btn" type="button" data-tecnica="Bordado" aria-pressed="false">Bordado</button>

                <fieldset class="detalle-grupo detalle-colores">
                    <legend>Color</legend>
                    <div class="detalle-swatches">
                        <button type="button" class="detalle-swatch" data-color="Rojo" aria-label="Rojo" aria-pressed="true" style="--swatch: #9b3329;"></button>
                        <button type="button" class="detalle-swatch" data-color="Verde" aria-label="Verde" aria-pressed="false" style="--swatch: #647467;"></button>
                        <button type="button" class="detalle-swatch" data-color="Mostaza" aria-label="Mostaza" aria-pressed="false" style="--swatch: #b99e46;"></button>
                        <button type="button" class="detalle-swatch" data-color="Terracota" aria-label="Terracota" aria-pressed="false" style="--swatch: #ac5637;"></button>
                    </div>
                </fieldset>

                <fieldset class="detalle-grupo detalle-tallas">
                    <legend>Talla</legend>

                        <button type="button" data-talla="S" aria-pressed="true">S</button>
                        <button type="button" data-talla="M" aria-pressed="false">M</button>

                <a id="detalle-personalizar" class="detalle-cta" href="personalizar_producto.html?producto=Camisa%20Skater%20Break&amp;tecnica=Impresi%C3%B3n&amp;color=Rojo&amp;talla=S">

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            const preview = document.getElementById('detalle-preview');
            const principal = document.getElementById('detalle-imagen-principal');
            const enlace = document.getElementById('detalle-personalizar');
            const seleccion = { tecnica: 'Impresión', color: 'Rojo', talla: 'S' };

            function actualizarEnlace() {
                const parametros = new URLSearchParams({
                    producto: 'Camisa Skater Break',
                    tecnica: seleccion.tecnica,
                    color: seleccion.color,
                    talla: seleccion.talla
                });
                enlace.href = `personalizar_producto.html?${parametros.toString()}`;
            }

            function activarOpcion(botones, elegido) {
                botones.forEach(boton => {
                    boton.setAttribute('aria-pressed', String(boton === elegido));
                });
            }

            const miniaturas = [...document.querySelectorAll('.detalle-miniatura')];
            const vistas = [
                'Camisa Skater Break blanca, vista frontal',
                'Camisa Skater Break, vista inclinada',
                'Acercamiento al estampado de la Camisa Skater Break',
                'Detalle superior de la Camisa Skater Break',
                'Detalle del estampado de la Camisa Skater Break',
                'Primer plano del estampado de la Camisa Skater Break'
            ];
            miniaturas.forEach(boton => {
                boton.addEventListener('click', () => {
                    const vista = Number(boton.dataset.vista);
                    preview.dataset.vista = String(vista);
                    principal.alt = vistas[vista];
                    activarOpcion(miniaturas, boton);
                });
            });

            const tecnicas = [...document.querySelectorAll('.detalle-tecnica-btn')];
            tecnicas.forEach(boton => {
                boton.addEventListener('click', () => {
                    seleccion.tecnica = boton.dataset.tecnica;
                    activarOpcion(tecnicas, boton);
                    actualizarEnlace();
                });
            });

            const colores = [...document.querySelectorAll('.detalle-swatch')];
            colores.forEach(boton => {
                boton.addEventListener('click', () => {
                    seleccion.color = boton.dataset.color;
                    activarOpcion(colores, boton);
                    actualizarEnlace();
                });
            });

            const tallas = [...document.querySelectorAll('.detalle-tallas-opciones button')];
            tallas.forEach(boton => {
                boton.addEventListener('click', () => {
                    seleccion.talla = boton.dataset.talla;
                    activarOpcion(tallas, boton);
                    actualizarEnlace();
                });
            });
        })();
    </script>
</body>
</html>
